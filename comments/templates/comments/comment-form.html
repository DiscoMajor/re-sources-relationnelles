<turbo-frame id="comment-form">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Enregistrer</button>
      {% if object %}
          <a href="{% url 'comments:list' object.ressource.pk %}" data-turbo-frame="_top">Annuler</a>
      {% else %}
          <a href="{% url 'comments:list' ressource_pk %}" data-turbo-frame="_top">Annuler</a>
      {% endif %}
    </form>
  </turbo-frame>
