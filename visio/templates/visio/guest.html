{% extends 'base.html' %}
{% load static %}

{% block title %}LIVE MEETING PAGE{% endblock %}

{% block content %}
    {% include './meeting_status.html' %}
    {% block script %}
    <script src='https://meet.jit.si/external_api.js'></script>
    <script>
        const domain = 'meet.jit.si'
        const options = {
            roomName: '{{ meeting.title_of_meeting }}',
            width: '100%',
            height: '100%',
            parentNode: document.querySelector('#meet'),
            lang: 'fr',
            configOverwrite: {
                disableRemoteMute: true,
                remoteVideoMenu: {
                    disableKick: true
                },
            },
            interfaceConfigOverwrite: {
                filmStripOnly: true,
                TOOLBAR_BUTTONS: ['microphone', 'camera', 'closedcaptions', 'desktop', 
                'fullscreen', 'fodeviceselection', 'chat', 'etherpad', 'raisehand', 'filmstrip', 'shortcuts', 'tileview','download', 'help','hangup'], 
            }
        };
    const api = new JitsiMeetExternalAPI(domain, options);
    </script>
    {% endblock %}
{% endblock %}
