{% extends 'base.html' %}
{% load static %}
{% block title %}Visioconférence{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
  <h2 class="text-2xl font-bold mb-6">Nouvelle conférence</h2>
  <div class="bg-white p-6 rounded-lg shadow-md">
    <form method="post">
      {%csrf_token%}
      <div class="space-y-4 mb-6">
        {{ form.as_p }}
      </div>
      <div class="flex space-x-4">
        <button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-500">Créer</button>
        <a href="{% url 'ressources:list' %}" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">Annuler</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    flatpickr(".flatpickr", {
        locale: "fr",
        enableTime: true,
        dateFormat: "Y-m-d H:i",
        time_24hr: true,
        minDate: "today",
        minuteIncrement: 15
    });
});
</script>
{% endblock %}
