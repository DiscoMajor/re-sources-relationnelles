{% extends 'base.html' %}

{% block title %}Cartographie{% endblock %}

{% block extra_css %}
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
<style>
    #map {
        height: 100%;
        width: 100%;
    }
</style>
{% endblock %}

{% block content %}
<div class="container mx-auto p-4">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Carte</h1>

    <div class="flex flex-col lg:flex-row gap-4 h-[600px]">
        <div class="w-full lg:w-3/4 bg-white rounded-lg shadow-md overflow-hidden">
            <div id="map" class="rounded-lg"></div>
        </div>
        
        <div class="w-full lg:w-1/4 bg-white rounded-lg shadow-md p-4">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Filtres</h2>
            
            <p class="text-gray-500 text-sm">Les filtres seront ajoutés ultérieurement.</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

<script>
    var map = L.map('map').setView([48.856614, 2.3522219], 13);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
    }).addTo(map);
</script>
{% endblock %}
